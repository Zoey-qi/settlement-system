{% import '_macros.html' as ui %}
{% extends 'base.html' %}
{% block title %}错误 - {{ app_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        {{ ui.icon('exclamation-triangle', 'bi text-warning', 16) }}
        <h3 class="mt-3">错误 {{ code }}</h3>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">{{ ui.icon('house', 'bi', 16) }} 返回首页</a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}错误 - {{ app_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem;"></i>
        <h3 class="mt-3">错误 {{ code }}</h3>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="bi bi-house"></i> 返回首页</a>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜预览 - 帕基尔结算系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="static/css/style.css" rel="stylesheet">
</head>
<body style="background:var(--c-bg); padding:32px;">
<div class="container" style="max-width:920px;">
  <div class="card shadow-sm border-info">
    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
      <span><i class="bi bi-trophy-fill"></i> 全部部门完成情况对比 · 排名榜</span>
      <small class="text-white-50">实时更新 · 当前时间 <span id="ranking-now">2026-08-06 19:14:00</span></small>
    </div>
    <div class="card-body p-3">
      <div class="rank-board" id="rb"></div>
    </div>
    <div class="card-footer bg-light text-muted small">
      <i class="bi bi-info-circle"></i> 排名按完成率降序，完成率 = 已完成任务 ÷ 总任务数。蓝色高亮为当前用户所属部门，金牌为本月冠军部门。
    </div>
  </div>
</div>

<script>
const data = [
  {rank:1, dept:'生产调度部',     total:14, completed:14, pending:0, overdue:0, rate:100, mine:false},
  {rank:2, dept:'工程质量技术部', total:14, completed:12, pending:2, overdue:0, rate:85,  mine:false},
  {rank:3, dept:'安全环保部',     total:14, completed:10, pending:4, overdue:1, rate:72,  mine:false},
  {rank:4, dept:'设备物资部',     total:14, completed:9,  pending:5, overdue:2, rate:64,  mine:true},
  {rank:5, dept:'综合办公室（含原HR）', total:18, completed:10, pending:8, overdue:0, rate:56, mine:false},
  {rank:7, dept:'合同管理部',     total:14, completed:3,  pending:11,overdue:3, rate:18,  mine:false},
  {rank:8, dept:'项目领导',       total:14, completed:1,  pending:13,overdue:0, rate:5,   mine:false},
];
const rb = document.getElementById('rb');
data.forEach(s => {
  const champ = s.rank === 1 && s.rate > 0;
  const medalCls = champ ? 'r1' : s.rank === 2 ? 'r2' : s.rank === 3 ? 'r3' : 'rn';
  const medal = champ ? '<i class="bi bi-trophy-fill"></i>' : s.rank;
  const barCls = s.rate >= 80 ? 'bg-success' : s.rate >= 50 ? 'bg-info' : s.rate >= 25 ? 'bg-warning' : 'bg-danger';
  rb.insertAdjacentHTML('beforeend', `
    <div class="rank-row ${champ ? 'is-champion' : ''} ${s.mine ? 'is-mine' : ''}">
      <div class="rank-medal ${medalCls}">${medal}</div>
      <div class="rank-main">
        <div class="rank-name">${s.dept}
          ${s.mine ? '<span class="rank-tag mine"><i class="bi bi-bookmark-star-fill"></i> 本部门</span>' : ''}
          ${champ ? '<span class="rank-tag champ"><i class="bi bi-trophy-fill"></i> 第一</span>' : ''}
        </div>
        <div class="rank-bar"><div class="progress" style="height:10px;"><div class="progress-bar ${barCls}" role="progressbar" style="width:${s.rate}%"></div></div></div>
      </div>
      <div class="rank-rate">${s.rate}<span class="pct">%</span></div>
      <div class="rank-stats">
        <span class="rstat"><b>${s.total}</b>总</span>
        <span class="rstat ok"><b>${s.completed}</b>完成</span>
        <span class="rstat warn"><b>${s.pending}</b>未完</span>
        <span class="rstat bad"><b>${s.overdue}</b>逾期</span>
      </div>
    </div>`);
});
</script>
</body>
</html>

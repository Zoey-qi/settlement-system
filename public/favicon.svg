<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16264F"/>
      <stop offset="60%" stop-color="#0A1730"/>
      <stop offset="100%" stop-color="#060E22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#2A4A9E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A1730" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6C66E"/>
      <stop offset="40%" stop-color="#C9A227"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7A5606"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底（与品牌卡片一致，rx=112 @512） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 蓝色内环 -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#1E40AF" stroke-width="10" opacity="0.85"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3B5BA9" stroke-width="2" opacity="0.4"/>

  <!-- 金色盾牌（暗金金属光泽，与系统图标统一） -->
  <path d="M256 158
           L342 196
           L342 270
           Q342 344 256 376
           Q170 344 170 270
           L170 196 Z"
        fill="url(#gold-metal)"/>
  <!-- 盾牌内描边高光 -->
  <path d="M256 158 L342 196 L342 270 Q342 344 256 376 Q170 344 170 270 L170 196 Z"
        fill="none" stroke="#F0D98A" stroke-width="3" opacity="0.45"/>
  <!-- 盾牌中央竖向分隔（呼应"工程/结算"结构感） -->
  <path d="M256 196 L256 360" stroke="#7A5606" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <!-- 顶部小盾尖 -->
  <path d="M256 170 L256 196" stroke="#F0D98A" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
</svg>
